name: Stage 3 public QA snapshot

on:
  push:
    branches: [stage-3-full-ui]
    paths-ignore:
      - 'stage3-public-preview/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage3-public-qa-snapshot
  cancel-in-progress: true

jobs:
  build-and-publish-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage-3-full-ui
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate authoritative data
        run: npm run validate:data
      - name: Validate Stage 3 UI
        run: npm run validate:ui
      - name: Build relative-path public snapshot
        run: npx vite build --base ./
      - name: Commit temporary public snapshot to Stage 3 branch
        run: |
          rm -rf stage3-public-preview
          mkdir -p stage3-public-preview
          cp -R dist/. stage3-public-preview/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stage3-public-preview
          if git diff --cached --quiet; then
            echo "Snapshot already current"
          else
            git commit -m "chore: refresh temporary Stage 3 public preview"
            git push origin HEAD:stage-3-full-ui
          fi
      - name: Upload exact snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage3-public-preview-snapshot
          path: ./stage3-public-preview
          if-no-files-found: error
          retention-days: 7
