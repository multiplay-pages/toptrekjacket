name: Stage 3 QA build artifact

on:
  push:
    branches: [stage-3-full-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage3-qa-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate authoritative data
        run: npm run validate:data
      - name: Validate Stage 3 UI
        run: npm run validate:ui
      - name: Build QA artifact
        run: npx vite build
      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage3-dist
          path: ./dist
          if-no-files-found: error
          retention-days: 7
