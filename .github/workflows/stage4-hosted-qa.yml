name: Stage 4 hosted staging QA

on:
  push:
    branches:
      - stage-4-hosted-qa

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: 926452d67ed4c9ea06d29e848974995ffdca509f
  STAGING_DEPLOYMENT_ID: dpl_7e6uuGp24tCMFPAfqU9RSVdDzUGJ
  STAGING_BASE_URL: https://trek-jacket-finder-qpjvkp1sb-lukaszs-projects-d71b6aef.vercel.app
  VERCEL_TEAM_ID: team_7hPovBT2iV7GpndA5ssdCTZs
  VERCEL_PROJECT_ID: prj_CPwoFJEb8N8b7s7Ks8NKRvzFB69p
  BYPASS_NOTE: Stage 4 hosted QA temporary

jobs:
  hosted-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main application commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate exact main
        run: |
          npm install --no-audit --no-fund
          npm run validate:data
          npm run validate:ui
          npm run build
          grep -Eq 'src="/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/assets/[^"]+\.css"' dist/index.html
          ! grep -Eqi 'raw\.githack\.com|raw\.githubusercontent\.com|github\.io' dist/index.html

      - name: Acquire temporary automation bypass on QA project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PROJECT_JSON="$(curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID")"
          BYPASS="$(node -e '
            const j=JSON.parse(process.argv[1]); const note=process.argv[2]; const pb=j.protectionBypass||{};
            const hit=Object.entries(pb).find(([k,v]) => /^[A-Za-z0-9]{32}$/.test(k) && v && v.note===note);
            if(hit) process.stdout.write(hit[0]);
          ' "$PROJECT_JSON" "$BYPASS_NOTE")"
          if [ -z "$BYPASS" ]; then
            RESPONSE="$(curl -fsS -X PATCH \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "{\"generate\":{\"note\":\"$BYPASS_NOTE\"}}" \
              "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_TEAM_ID")"
            BYPASS="$(node -e '
              const j=JSON.parse(process.argv[1]); const note=process.argv[2]; const pb=j.protectionBypass||{};
              if(typeof pb === "string") { process.stdout.write(pb); process.exit(0); }
              const entries=Object.entries(pb);
              const hit=entries.find(([k,v]) => /^[A-Za-z0-9]{32}$/.test(k) && v && v.note===note) || entries.find(([k]) => /^[A-Za-z0-9]{32}$/.test(k));
              if(!hit) process.exit(2); process.stdout.write(hit[0]);
            ' "$RESPONSE" "$BYPASS_NOTE")"
          fi
          test -n "$BYPASS"
          echo "::add-mask::$BYPASS"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$BYPASS" >> "$GITHUB_ENV"

      - name: Verify hosted HTML and local assets
        run: |
          set -euo pipefail
          AUTH=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" -H 'x-vercel-set-bypass-cookie: true')
          curl -fsSL "${AUTH[@]}" "$STAGING_BASE_URL/" -o stage4-index.html
          grep -Eo '(src|href)="[^"]+"' stage4-index.html | tee stage4-asset-refs.txt
          grep -Eq 'src="/assets/[^"]+\.js"' stage4-index.html
          grep -Eq 'href="/assets/[^"]+\.css"' stage4-index.html
          ! grep -Eqi 'raw\.githack\.com|raw\.githubusercontent\.com|github\.io' stage4-index.html
          JS_PATH="$(grep -Eo 'src="/assets/[^"]+\.js"' stage4-index.html | head -1 | sed -E 's/^src="([^"]+)"$/\1/')"
          CSS_PATH="$(grep -Eo 'href="/assets/[^"]+\.css"' stage4-index.html | head -1 | sed -E 's/^href="([^"]+)"$/\1/')"
          JS_STATUS="$(curl -sS -L "${AUTH[@]}" -o /tmp/stage4-app.js -w '%{http_code}' "$STAGING_BASE_URL$JS_PATH")"
          CSS_STATUS="$(curl -sS -L "${AUTH[@]}" -o /tmp/stage4-app.css -w '%{http_code}' "$STAGING_BASE_URL$CSS_PATH")"
          printf 'deployment=%s\nbase=%s\njs=%s http=%s bytes=%s\ncss=%s http=%s bytes=%s\n' \
            "$STAGING_DEPLOYMENT_ID" "$STAGING_BASE_URL" "$JS_PATH" "$JS_STATUS" "$(wc -c </tmp/stage4-app.js)" "$CSS_PATH" "$CSS_STATUS" "$(wc -c </tmp/stage4-app.css)" | tee stage4-http-evidence.txt
          test "$JS_STATUS" = 200
          test "$CSS_STATUS" = 200
          test -s /tmp/stage4-app.js
          test -s /tmp/stage4-app.css

      - name: Prepare auth-only copy of exact Stage 3 E2E
        run: |
          cp scripts/e2e-stage3.mjs stage4-e2e-auth.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'stage4-e2e-auth.mjs'
          let src = readFileSync(path, 'utf8')
          const needle = "const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } })\n"
          const injected = needle + `if (process.env.VERCEL_AUTOMATION_BYPASS_SECRET) {\n  const protectedOrigin = new URL(URL).origin\n  await context.route(protectedOrigin + '/**', async route => {\n    await route.continue({ headers: { ...route.request().headers(), 'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_SECRET, 'x-vercel-set-bypass-cookie': 'true' } })\n  })\n}\n`
          if (!src.includes(needle)) throw new Error('Expected Stage 3 browser context hook not found')
          writeFileSync(path, src.replace(needle, injected))
          NODE

      - name: Run Stage 3 35-check suite against hosted staging
        env:
          STAGE3_URL: ${{ env.STAGING_BASE_URL }}
        run: node stage4-e2e-auth.mjs

      - name: Diagnose browser console and HTTP errors
        env:
          STAGE3_URL: ${{ env.STAGING_BASE_URL }}
        run: |
          node --input-type=module <<'NODE' | tee stage4-browser-diagnostics.json
          import { chromium } from 'playwright-core'
          import { existsSync } from 'node:fs'
          const browserCandidates=[process.env.CHROME_BIN,'/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].filter(Boolean)
          const executablePath=browserCandidates.find(path=>existsSync(path)); if(!executablePath) throw new Error('No Chrome/Chromium')
          const badResponses=[],consoleErrors=[],failedRequests=[],pageErrors=[]
          const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox']})
          const context=await browser.newContext({viewport:{width:1440,height:1000}})
          const protectedOrigin=new URL(process.env.STAGE3_URL).origin
          await context.route(protectedOrigin+'/**',async route=>route.continue({headers:{...route.request().headers(),'x-vercel-protection-bypass':process.env.VERCEL_AUTOMATION_BYPASS_SECRET,'x-vercel-set-bypass-cookie':'true'}}))
          const page=await context.newPage()
          page.on('response',r=>{if(r.status()>=400) badResponses.push({status:r.status(),url:r.url(),resourceType:r.request().resourceType()})})
          page.on('console',m=>{if(m.type()==='error') consoleErrors.push({text:m.text(),location:m.location()})})
          page.on('requestfailed',r=>failedRequests.push({url:r.url(),error:r.failure()?.errorText||''}))
          page.on('pageerror',e=>pageErrors.push(String(e)))
          await page.goto(process.env.STAGE3_URL,{waitUntil:'domcontentloaded',timeout:30000})
          await page.waitForSelector('[data-testid="scenario-selector"]',{timeout:15000})
          await page.waitForTimeout(5000)
          console.log(JSON.stringify({badResponses,consoleErrors,failedRequests,pageErrors},null,2))
          if(badResponses.length||consoleErrors.length||failedRequests.length||pageErrors.length) process.exitCode=1
          await browser.close()
          NODE

      - name: Upload Stage 4 hosted QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-hosted-e2e-evidence
          path: |
            stage3-e2e-report.json
            stage3-e2e-desktop.png
            stage3-e2e-mobile.png
            stage4-index.html
            stage4-asset-refs.txt
            stage4-http-evidence.txt
            stage4-browser-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Revoke temporary automation bypass
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then exit 0; fi
          BODY="$(node -e 'process.stdout.write(JSON.stringify({revoke:{secret:process.env.VERCEL_AUTOMATION_BYPASS_SECRET,regenerate:false}}))')"
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_TEAM_ID" >/dev/null
