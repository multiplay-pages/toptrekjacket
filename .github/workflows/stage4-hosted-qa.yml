name: Stage 4 hosted staging QA

on:
  push:
    branches:
      - stage-4-hosted-qa

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: 47e954aec64b23abf54316835704bf9b00e1f422
  STAGING_DEPLOYMENT_ID: dpl_GCAYnGvLccFno9RPJgNFMkMfMRAv
  STAGING_SHARE_URL: https://trek-jacket-finder-d19bt5a7v-lukaszs-projects-d71b6aef.vercel.app/?_vercel_share=Vj5ttYIOX55GcamQ6gyb7Doi3q3OJ3XL

jobs:
  hosted-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main application commit
        uses: actions/checkout@v4
        with:
          ref: 47e954aec64b23abf54316835704bf9b00e1f422

      - name: Verify source commit
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected main: $EXPECTED_MAIN_SHA"
          echo "Checked out:   $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_MAIN_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate exact main before hosted QA
        run: |
          npm run validate:data
          npm run validate:ui
          npm run build
          grep -Eq 'src="/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="/assets/[^"]+\.css"' dist/index.html
          if grep -Eqi 'raw\.githack\.com|raw\.githubusercontent\.com|github\.io' dist/index.html; then
            echo "External GitHub-hosted runtime asset reference found in local build"
            exit 1
          fi

      - name: Verify hosted HTML and local assets over authenticated preview
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "$STAGING_SHARE_URL" | sed -E 's#^(https?://[^/]+).*$#\1#')"
          curl -fsSL -c stage4-cookies.txt -b stage4-cookies.txt "$STAGING_SHARE_URL" -o stage4-index.html
          echo "--- hosted index asset references ---"
          grep -Eo '(src|href)="[^"]+"' stage4-index.html | tee stage4-asset-refs.txt
          grep -Eq 'src="/assets/[^"]+\.js"' stage4-index.html
          grep -Eq 'href="/assets/[^"]+\.css"' stage4-index.html
          if grep -Eqi 'raw\.githack\.com|raw\.githubusercontent\.com|github\.io' stage4-index.html; then
            echo "External GitHub-hosted runtime asset reference found in hosted index"
            exit 1
          fi
          JS_PATH="$(grep -Eo 'src="/assets/[^"]+\.js"' stage4-index.html | head -1 | sed -E 's/^src="([^"]+)"$/\1/')"
          CSS_PATH="$(grep -Eo 'href="/assets/[^"]+\.css"' stage4-index.html | head -1 | sed -E 's/^href="([^"]+)"$/\1/')"
          JS_STATUS="$(curl -sS -L -c stage4-cookies.txt -b stage4-cookies.txt -o /tmp/stage4-app.js -w '%{http_code}' "$BASE_URL$JS_PATH")"
          CSS_STATUS="$(curl -sS -L -c stage4-cookies.txt -b stage4-cookies.txt -o /tmp/stage4-app.css -w '%{http_code}' "$BASE_URL$CSS_PATH")"
          printf 'deployment=%s\nbase=%s\njs=%s http=%s bytes=%s\ncss=%s http=%s bytes=%s\n' \
            "$STAGING_DEPLOYMENT_ID" "$BASE_URL" "$JS_PATH" "$JS_STATUS" "$(wc -c </tmp/stage4-app.js)" "$CSS_PATH" "$CSS_STATUS" "$(wc -c </tmp/stage4-app.css)" | tee stage4-http-evidence.txt
          test "$JS_STATUS" = "200"
          test "$CSS_STATUS" = "200"
          test -s /tmp/stage4-app.js
          test -s /tmp/stage4-app.css

      - name: Run exact Stage 3 E2E against hosted staging
        env:
          STAGE3_URL: ${{ env.STAGING_SHARE_URL }}
        run: npm run e2e:stage3

      - name: Diagnose browser console and HTTP errors
        env:
          STAGE3_URL: ${{ env.STAGING_SHARE_URL }}
        run: |
          node --input-type=module <<'NODE' | tee stage4-browser-diagnostics.json
          import { chromium } from 'playwright-core'
          import { existsSync } from 'node:fs'

          const browserCandidates = [
            process.env.CHROME_BIN,
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser',
          ].filter(Boolean)
          const executablePath = browserCandidates.find(path => existsSync(path))
          if (!executablePath) throw new Error('No Chrome/Chromium')

          const badResponses = []
          const consoleErrors = []
          const failedRequests = []
          const pageErrors = []
          const browser = await chromium.launch({ executablePath, headless: true, args: ['--no-sandbox'] })
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } })
          const page = await context.newPage()
          page.on('response', response => {
            if (response.status() >= 400) badResponses.push({
              status: response.status(),
              url: response.url(),
              resourceType: response.request().resourceType(),
            })
          })
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push({ text: message.text(), location: message.location() })
          })
          page.on('requestfailed', request => failedRequests.push({ url: request.url(), error: request.failure()?.errorText || '' }))
          page.on('pageerror', error => pageErrors.push(String(error)))

          await page.goto(process.env.STAGE3_URL, { waitUntil: 'domcontentloaded', timeout: 30000 })
          await page.waitForSelector('[data-testid="scenario-selector"]', { timeout: 15000 })
          await page.waitForTimeout(5000)
          console.log(JSON.stringify({ badResponses, consoleErrors, failedRequests, pageErrors }, null, 2))
          await browser.close()
          NODE

      - name: Upload Stage 4 hosted QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-hosted-e2e-evidence
          path: |
            stage3-e2e-report.json
            stage3-e2e-desktop.png
            stage3-e2e-mobile.png
            stage4-index.html
            stage4-asset-refs.txt
            stage4-http-evidence.txt
            stage4-browser-diagnostics.json
          if-no-files-found: ignore
          retention-days: 14
