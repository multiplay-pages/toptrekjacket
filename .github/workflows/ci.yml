name: Trek Jacket Finder checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate authoritative product data
        run: npm run validate:data
      - name: Validate Stage 7 UI integrity
        run: npm run validate:ui
      - name: Build
        run: npm run build
      - name: Run Stage 7 browser E2E
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > stage7-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Preview server did not become ready"
              cat stage7-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run e2e:stage7
          npm run e2e:stage8
      - name: Upload Stage 7 + Stage 8 E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-stage8-e2e-evidence
          path: |
            stage7-e2e-report.json
            stage7-e2e-desktop.png
            stage7-e2e-mobile.png
            stage8-layout-report.json
            stage8-layout-desktop.png
            stage8-layout-tablet.png
            stage8-layout-mobile.png
            stage7-preview.log
          if-no-files-found: ignore
          retention-days: 14
