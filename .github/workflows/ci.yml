name: Trek Jacket Finder checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate authoritative product data
        run: npm run validate:data
      - name: Validate Stage 3 UI integrity
        run: npm run validate:ui
      - name: Build
        run: npm run build
