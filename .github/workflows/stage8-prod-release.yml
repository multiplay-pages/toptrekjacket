name: Stage 8 Production Finalize

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage8-prod-release.yml

permissions:
  contents: read

concurrency:
  group: stage8-production-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_7hPovBT2iV7GpndA5ssdCTZs
      VERCEL_PROJECT_ID: prj_rMjJIycxQZmCSvPpupYs5PsbqFjm
      SOURCE_APP_SHA: ed317ceb78049553711320485f85efdb190fa6ba
      TARGET_DEPLOYMENT_ID: dpl_HrSj9CgsCFmcw1fWYHJevSif9RPH
      TARGET_DEPLOYMENT_URL: https://trek-jacket-finder-jj48ozh71-lukaszs-projects-d71b6aef.vercel.app
      ROLLBACK_DEPLOYMENT_ID: dpl_87skmWGp2PpsXKrPbzzRvfjssgeb
      CANONICAL_HOST: trek-jacket-finder.vercel.app
      CANONICAL_URL: https://trek-jacket-finder.vercel.app
      EXPECTED_JS: /assets/index-QmogjXes.js
      EXPECTED_CSS: /assets/index-CrP8tfe-.css
      ROLLBACK_JS: /assets/index-DTwjA7Z3.js
      ROLLBACK_CSS: /assets/index-BGyKH9R_.css

    steps:
      - name: Checkout exact merged application SHA
        uses: actions/checkout@v4
        with:
          ref: ed317ceb78049553711320485f85efdb190fa6ba

      - name: Verify exact source SHA
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)
          test "$ACTUAL_SHA" = "$SOURCE_APP_SHA" || { echo "Unexpected source SHA: $ACTUAL_SHA"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing"; exit 1; }

      - name: Install dependencies for post-production browser gate
        run: npm install --no-audit --no-fund

      - name: Verify target deployment identity before alias switch
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_JSON=$(curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$TARGET_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")
          node - <<'NODE' "$DEPLOYMENT_JSON" "$SOURCE_APP_SHA"
          const d = JSON.parse(process.argv[2])
          const expected = process.argv[3]
          if (d.readyState !== 'READY' && d.state !== 'READY') throw new Error(`Deployment not READY: ${d.readyState || d.state}`)
          if (d.meta?.githubCommitSha !== expected) throw new Error(`Unexpected source SHA: ${d.meta?.githubCommitSha}`)
          console.log(`Verified deployment ${d.id} from ${d.meta.githubCommitSha}`)
          NODE

      - name: Point canonical alias to tested Stage 8 production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"alias\":\"$CANONICAL_HOST\"}" \
            "https://api.vercel.com/v2/deployments/$TARGET_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
            | tee stage8-canonical-alias-response.json
          echo "ALIAS_SWITCHED=1" >> "$GITHUB_ENV"

      - name: Wait for canonical HTML and assets to converge
        run: |
          set -euo pipefail
          MATCHED=0
          for attempt in $(seq 1 24); do
            HTML=$(curl -sSL -H 'Cache-Control: no-cache' "$CANONICAL_URL/?release=$GITHUB_RUN_ID-$attempt" || true)
            JS_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$CANONICAL_URL$EXPECTED_JS" || true)
            CSS_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$CANONICAL_URL$EXPECTED_CSS" || true)
            if printf '%s' "$HTML" | grep -Fq "$EXPECTED_JS" \
              && printf '%s' "$HTML" | grep -Fq "$EXPECTED_CSS" \
              && [ "$JS_CODE" = "200" ] \
              && [ "$CSS_CODE" = "200" ]; then
              MATCHED=1
              echo "Canonical HTML + assets converged on attempt $attempt"
              break
            fi
            echo "Canonical propagation attempt $attempt/24: js=$JS_CODE css=$CSS_CODE"
            sleep 5
          done
          test "$MATCHED" = "1" || { echo "Canonical did not converge to expected Stage 8 HTML/assets"; exit 1; }
          echo "STAGE3_URL=$CANONICAL_URL" >> "$GITHUB_ENV"

      - name: Production canonical full regression E2E
        run: npm run e2e:stage7

      - name: Production canonical diagnostics gate
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const r = JSON.parse(fs.readFileSync('stage7-e2e-report.json', 'utf8'))
          const bad = {
            failedRequests: r.failedRequests || [],
            pageErrors: r.pageErrors || [],
            consoleErrors: r.consoleErrors || [],
          }
          console.log(JSON.stringify(bad, null, 2))
          if (bad.failedRequests.length || bad.pageErrors.length || bad.consoleErrors.length) process.exit(1)
          NODE

      - name: Production canonical Stage 8 responsive layout gate
        run: npm run e2e:stage8

      - name: Preserve production evidence
        run: |
          mv stage7-e2e-report.json production-stage7-e2e-report.json
          mv stage7-e2e-desktop.png production-stage7-e2e-desktop.png
          mv stage7-e2e-mobile.png production-stage7-e2e-mobile.png
          mv stage8-layout-report.json production-stage8-layout-report.json
          mv stage8-layout-desktop.png production-stage8-layout-desktop.png
          mv stage8-layout-tablet.png production-stage8-layout-tablet.png
          mv stage8-layout-mobile.png production-stage8-layout-mobile.png

      - name: Restore previous canonical alias on failure
        if: failure() && env.ALIAS_SWITCHED == '1'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"alias\":\"$CANONICAL_HOST\"}" \
            "https://api.vercel.com/v2/deployments/$ROLLBACK_DEPLOYMENT_ID/aliases?teamId=$VERCEL_ORG_ID" \
            | tee stage8-canonical-rollback-response.json

          RESTORED=0
          for attempt in $(seq 1 24); do
            HTML=$(curl -sSL -H 'Cache-Control: no-cache' "$CANONICAL_URL/?rollback=$GITHUB_RUN_ID-$attempt" || true)
            JS_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$CANONICAL_URL$ROLLBACK_JS" || true)
            CSS_CODE=$(curl -sSL -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$CANONICAL_URL$ROLLBACK_CSS" || true)
            if printf '%s' "$HTML" | grep -Fq "$ROLLBACK_JS" \
              && printf '%s' "$HTML" | grep -Fq "$ROLLBACK_CSS" \
              && [ "$JS_CODE" = "200" ] \
              && [ "$CSS_CODE" = "200" ]; then
              RESTORED=1
              echo "Previous canonical HTML + assets restored on attempt $attempt"
              break
            fi
            sleep 5
          done
          test "$RESTORED" = "1" || { echo "Rollback alias did not converge"; exit 1; }

      - name: Upload final production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-production-final-evidence
          path: |
            stage8-canonical-alias-response.json
            stage8-canonical-rollback-response.json
            production-stage7-e2e-report.json
            production-stage7-e2e-desktop.png
            production-stage7-e2e-mobile.png
            production-stage8-layout-report.json
            production-stage8-layout-desktop.png
            production-stage8-layout-tablet.png
            production-stage8-layout-mobile.png
          if-no-files-found: ignore
          retention-days: 14
