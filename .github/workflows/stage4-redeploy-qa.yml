name: Stage 6 production alias switch

on:
  push:
    branches: [stage-4-hosted-qa]

permissions:
  contents: read

env:
  DEPLOYMENT_URL: trek-jacket-finder-9ftga3r5y-lukaszs-projects-d71b6aef.vercel.app
  PRODUCTION_ALIAS: trek-jacket-finder.vercel.app

jobs:
  alias-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Point canonical production alias to corrected deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npm install --global vercel@59.16.0 --no-audit --no-fund
          vercel alias set "$DEPLOYMENT_URL" "$PRODUCTION_ALIAS" --token="$VERCEL_TOKEN"
