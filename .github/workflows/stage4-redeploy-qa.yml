name: Stage 6 corrected production deploy

on:
  push:
    branches: [stage-4-hosted-qa]

permissions:
  contents: read

env:
  SOURCE_SHA: 2efd033b33efecdaf87d5f37ae7f12a64397e849
  VERCEL_ORG_ID: team_7hPovBT2iV7GpndA5ssdCTZs
  VERCEL_PROJECT_ID: prj_rMjJIycxQZmCSvPpupYs5PsbqFjm

jobs:
  corrected-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validated main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revalidate exact source
        run: |
          npm install --no-audit --no-fund
          npm run validate:data
          npm run validate:ui
          npm run build

      - name: Deploy corrected Vite build to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cat > vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": "vite",
            "installCommand": "npm install --no-audit --no-fund",
            "buildCommand": "npm run build",
            "outputDirectory": "dist"
          }
          JSON
          npm install --global vercel@59.16.0 --no-audit --no-fund
          URL="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          echo "STAGE6_CORRECTED_PRODUCTION_URL=$URL" | tee stage6-corrected-production-url.txt

      - name: Upload production URL
        uses: actions/upload-artifact@v4
        with:
          name: stage6-corrected-production-url
          path: stage6-corrected-production-url.txt
          retention-days: 2
